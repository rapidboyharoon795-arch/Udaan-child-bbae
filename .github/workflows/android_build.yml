name: Android CI/CD - UdaanChild

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # Humne cache hata diya hai taaki koi purana version interference na kare
          
      # YAHAN SABSE BADA CHANGE HAI:
      # Hum 'gradle' command ki jag jagah 'gradlew' use karenge, 
      # lekin humne pehle hi wrapper fix kar diya hai.
      # Agar aapne wrapper nahi banaya, toh hum seedha 'gradle' use karenge 
      # par ek specific version ke saath.
      
      - name: Build Debug APK
        # Humne '--version' check karne ke liye ye command use kiya hai
        # Agar aapka wrapper kaam nahi kar raha, toh hum direct command chalayenge
        run: gradle assembleDebug --warning-mode all

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UdaanChild-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
