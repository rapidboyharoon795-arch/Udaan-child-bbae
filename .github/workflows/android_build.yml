name: Android CI/CD - UdaanChild

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # HUMNE './gradlew' KO HATA DIYA HAI
      # Hum seedha 'gradle' command use karenge jo GitHub ke server par pehle se hai
      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UdaanChild-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
