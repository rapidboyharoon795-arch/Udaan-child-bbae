name: Android CI/CD - UdaanChild (No Wrapper Version)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # Humne 'cache: gradle' hata diya kyunki wrapper nahi hai
          # Isse build thoda slow hoga par chal jayega

      # YAHAN HUMNE 'chmod gradlew' KO HATA DIYA KYUNKI FILE HAI HI NAHI
      
      - name: Build Debug APK
        # Humne './gradlew' ki jag jagah seedha 'gradle' command use kiya hai
        # GitHub ke Ubuntu server par 'gradle' pehle se installed hota hai
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UdaanChild-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
